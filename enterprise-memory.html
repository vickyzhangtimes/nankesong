<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>企业记忆 · Agentry 企捏捏</title>
  <link rel="stylesheet" href="./assets/tokens.css" />
  <style>
    body { background: var(--bg); }
    .nks-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .nks-main { flex: 1; display: grid; grid-template-columns: 240px 1fr 320px; gap: var(--sp-4); max-width: 1440px; margin: 0 auto; padding: var(--sp-4) 0; }
    .nks-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: var(--sp-4); }
    .mem-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--success); color: #fff; border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; margin-bottom: var(--sp-2); }
    .lib-list { display: grid; gap: var(--sp-3); }
    .lib-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); padding: var(--sp-3); }
    .lib-card .name { color: var(--ink); font-weight: 700; font-size: 15px; }
    .lib-card .scope { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .lib-card .items { color: var(--text); font-size: 13px; margin-bottom: 4px; }
    .lib-card .status { color: var(--success); font-size: 12px; font-weight: 700; }
    .lib-card .status.uploading { color: var(--primary); }
    .lib-card .status.error { color: var(--danger); }
    .next-btn { margin-top: var(--sp-4); width: 100%; }
    .timeline { margin-top: var(--sp-4); }
    @media (max-width: 1100px) { .nks-main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="nks-shell">
    <main class="nks-main">
      <!-- 左侧步骤导航 -->
      <aside class="nks-card" style="padding:16px;">
        <div class="nks-stepnav">
          <div class="item"><span class="n">1</span><div><div class="title">认知与空间</div><div class="sub">理解产品，创建企业空间</div></div></div>
          <div class="item active"><span class="n">2</span><div><div class="title">企业记忆</div><div class="sub">企业库 / 部门库</div></div></div>
          <div class="item"><span class="n">3</span><div><div class="title">路由与骨架</div><div class="sub">判断岗位 + 七层骨架</div></div></div>
          <div class="item"><span class="n">4</span><div><div class="title">执行与迭代</div><div class="sub">生成员工 + V1 输出</div></div></div>
        </div>
      </aside>
      <!-- 中间主卡：企业记忆库 -->
      <section>
        <div class="nks-card">
          <span class="mem-pill">✓ 已读取 6 条企业记忆</span>
          <h1 style="font-size:24px;margin-bottom:6px;">企业记忆库</h1>
          <p style="color:var(--muted);font-size:14px;margin-bottom:var(--sp-3);">企业库、部门库、任务库三层资产，所有 Agent 共享。可上传/补充资料，AI 员工会自动调用。</p>
          <div class="lib-list" id="lib-list"><!-- JS 注入 --></div>
          <button class="nks-btn primary lg next-btn" id="btn-next">进入岗位诊断 →</button>
        </div>
      </section>
      <!-- 右侧：企业身份证卡片 -->
      <aside>
        <div class="nks-card" id="id-card">
          <h2 style="font-size:16px;margin-bottom:var(--sp-2);">企业身份证</h2>
          <div id="id-body"><!-- JS 注入 --></div>
        </div>
      </aside>
    </main>
  </div>
  <script src="./assets/llm-config.js"></script>
  <script src="./assets/mock-data.js"></script>
  <script src="./assets/state.js"></script>
  <script>
    NKS.mountTopbar({ user: '张小北' });
    NKS.mountTimeline(1);
    const data = NKS.getCompanyData();
    // 渲染企业库
    const libs = data.libraries || [];
    document.getElementById('lib-list').innerHTML = libs.map(lib => `
      <div class="lib-card">
        <div class="name">${lib.name}</div>
        <div class="scope">${lib.scope}</div>
        <div class="items">${lib.items.map(i => `<span class='nks-tag'>${i}</span>`).join(' ')}</div>
        <div class="status">${lib.status}</div>
      </div>
    `).join('');
    // 企业身份证右侧卡
    const id = data.enterprise_identity;
    const idBody = Object.entries(id).map(([k,v]) => {
      let val = Array.isArray(v) ? v.join('，') : v;
      return `<div style='margin-bottom:8px;'><b style='color:var(--muted);font-size:12px;'>${k}</b><div style='color:var(--ink);font-size:13px;'>${val}</div></div>`;
    }).join('');
    document.getElementById('id-body').innerHTML = idBody;
    // 下一步按钮
    document.getElementById('btn-next').onclick = () => location.href = './product-demo-hub.html';
  </script>
</body>
</html>
