<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>岗位 Agent 工厂 · AI 员工仓库</title>
  <link rel="stylesheet" href="./assets/tokens.css" />
  <style>
    body {
      background:
        radial-gradient(circle at 16% 0%, rgba(47, 109, 246, 0.08), transparent 28%),
        var(--bg);
    }

    .roster-page {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: var(--sp-4);
      display: grid;
      gap: var(--sp-4);
    }

    .roster-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 360px);
      gap: var(--sp-4);
      align-items: start;
    }

    .title-line {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      flex-wrap: wrap;
    }

    .title-line h1 {
      font-size: 30px;
    }

    .secondary-title {
      color: var(--muted);
      font-size: 24px;
      font-weight: 700;
    }

    .hero-sub {
      margin-top: var(--sp-1);
      color: var(--muted);
      font-size: 15px;
    }

    .search-card {
      display: grid;
      gap: var(--sp-3);
      justify-items: end;
    }

    .search-box {
      width: 100%;
      height: 54px;
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      padding: 0 var(--sp-3);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .search-mark {
      width: 20px;
      height: 20px;
      border: 2px solid var(--muted);
      border-radius: 999px;
      position: relative;
      opacity: 0.45;
      flex: 0 0 auto;
    }

    .search-mark::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 2px;
      right: -6px;
      bottom: -3px;
      border-radius: 999px;
      background: var(--muted);
      transform: rotate(45deg);
    }

    .search-box input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
    }

    .sort-switch {
      display: inline-flex;
      padding: 4px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
    }

    .sort-switch button,
    .category-tabs button {
      border: 0;
      font: inherit;
      cursor: pointer;
    }

    .sort-switch button {
      min-width: 72px;
      height: 36px;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
    }

    .sort-switch button.active {
      color: var(--ink);
      background: var(--surface-2);
      box-shadow: var(--shadow-sm);
    }

    .category-bar {
      display: grid;
      gap: var(--sp-2);
    }

    .category-tabs {
      display: flex;
      gap: var(--sp-1);
      overflow-x: auto;
      padding-bottom: var(--sp-1);
      border-bottom: 8px solid rgba(11, 23, 51, 0.08);
      scrollbar-width: none;
    }

    .category-tabs::-webkit-scrollbar {
      display: none;
    }

    .category-tabs button {
      height: 44px;
      padding: 0 var(--sp-3);
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted);
      font-weight: 800;
      white-space: nowrap;
    }

    .category-tabs button.active {
      color: var(--ink);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--sp-2);
    }

    .summary-card {
      padding: var(--sp-3);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      display: grid;
      gap: 4px;
    }

    .summary-card b {
      color: var(--ink);
      font-size: 22px;
      line-height: 1.1;
    }

    .summary-card span {
      color: var(--muted);
      font-size: var(--fs-sm);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: var(--sp-3);
    }

    .employee-card {
      min-height: 226px;
      padding: var(--sp-3);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: var(--sp-3);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      color: var(--text);
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }

    .employee-card:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      box-shadow: var(--shadow);
    }

    .employee-top {
      display: flex;
      align-items: flex-start;
      gap: var(--sp-2);
      min-width: 0;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      flex: 0 0 52px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--primary-soft);
      border: 1px solid var(--line);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar.letter {
      color: var(--primary-ink);
      font-size: 22px;
      font-weight: 900;
    }

    .who {
      min-width: 0;
      display: grid;
      gap: 6px;
    }

    .who h3 {
      font-size: 15px;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tag-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .mini-tag {
      height: 24px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      border-radius: 7px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: var(--fs-xs);
      font-weight: 700;
    }

    .employee-desc {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.72;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .employee-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-1);
      padding-top: var(--sp-2);
      border-top: 1px dashed var(--line);
      color: var(--muted);
      font-size: var(--fs-xs);
      flex-wrap: wrap;
    }

    .employee-foot b {
      color: var(--ink);
      font-weight: 700;
    }

    .status {
      height: 26px;
      padding: 0 9px;
      display: inline-flex;
      align-items: center;
      border-radius: var(--radius-pill);
      color: var(--success);
      background: var(--success-soft);
      font-size: var(--fs-xs);
      font-weight: 800;
      white-space: nowrap;
    }

    .status.trial {
      color: var(--primary-ink);
      background: var(--primary-soft);
    }

    .status.pending {
      color: var(--muted);
      background: #EEF2F8;
    }

    .empty {
      display: none;
      padding: var(--sp-5);
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
    }

    @media (max-width: 1100px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .summary-strip { grid-template-columns: repeat(2, 1fr); }
      .roster-hero { grid-template-columns: 1fr; }
      .search-card { justify-items: stretch; }
    }

    @media (max-width: 760px) {
      .roster-page { padding: var(--sp-3); }
      .grid { grid-template-columns: 1fr; }
      .summary-strip { grid-template-columns: 1fr; }
      .title-line h1 { font-size: 26px; }
      .secondary-title { font-size: 20px; }
    }

    /* ── 三栏壳 ── */
    .nks-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .nks-main {
      flex: 1;
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr) 300px;
      gap: var(--sp-4);
      width: min(1400px, 100%);
      margin: 0 auto;
      padding: var(--sp-4);
      padding-bottom: 96px;
      align-items: start;
    }

    /* ── 左侧步骤导航 ── */
    .nks-stepnav { display: grid; gap: 4px; padding: var(--sp-2); }
    .nks-stepnav .item {
      display: flex; align-items: center; gap: var(--sp-2);
      padding: var(--sp-2); border-radius: var(--radius); color: var(--muted);
    }
    .nks-stepnav .item.active {
      background: var(--primary-soft); color: var(--primary-ink);
      box-shadow: inset 3px 0 0 var(--primary);
    }
    .nks-stepnav .item .n {
      width: 28px; height: 28px; border-radius: 999px;
      background: var(--surface-2); color: var(--muted);
      display: grid; place-items: center;
      font-weight: 700; font-size: var(--fs-sm); flex: 0 0 auto;
    }
    .nks-stepnav .item.active .n { background: var(--primary); color: #fff; }
    .nks-stepnav .item .title { font-weight: 600; font-size: 14px; }
    .nks-stepnav .item .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    /* ── 右侧上下文 ── */
    .ctx-row {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: var(--sp-2); padding: var(--sp-1) 0; border-bottom: 1px solid var(--line);
      font-size: var(--fs-sm);
    }
    .ctx-row:last-child { border-bottom: none; }
    .ctx-row .label { color: var(--muted); }
    .ctx-row .value { font-weight: 600; color: var(--ink); }
  </style>
</head>
<body>
  <div class="nks-shell">
    <main class="nks-main">
      <!-- 左侧步骤导航 -->
      <aside>
        <div class="nks-card flat">
          <nav class="nks-stepnav">
            <div class="item">
              <span class="n">1</span>
              <div><div class="title">认知与空间</div><div class="sub">理解产品，创建企业空间</div></div>
            </div>
            <div class="item">
              <span class="n">2</span>
              <div><div class="title">企业记忆</div><div class="sub">企业库 / 部门库</div></div>
            </div>
            <div class="item">
              <span class="n">3</span>
              <div><div class="title">路由与骨架</div><div class="sub">需求→路由→七层骨架</div></div>
            </div>
            <div class="item">
              <span class="n">✦</span>
              <div><div class="title">员工诞生</div><div class="sub">AI 员工生成确认</div></div>
            </div>
            <div class="item active">
              <span class="n">✦</span>
              <div><div class="title">员工仓库</div><div class="sub">浏览 · 搜索 · 派任务</div></div>
            </div>
            <div class="item">
              <span class="n">4</span>
              <div><div class="title">执行与迭代</div><div class="sub">任务运行 + 反馈</div></div>
            </div>
            <div class="item">
              <span class="n">5</span>
              <div><div class="title">进入工作台执行</div><div class="sub">V1 输出</div></div>
            </div>
          </nav>
          <div style="margin-top:var(--sp-3);padding:0 var(--sp-2);">
            <a href="./agent-birth-card.html" class="nks-btn" style="width:100%;justify-content:center;">← 员工诞生</a>
          </div>
        </div>
      </aside>

      <!-- 主内容：员工网格 -->
      <section>
        <div class="roster-page" style="padding:0;">
          <section class="roster-hero">
            <div>
              <div class="title-line">
                <h1>AI 员工仓库</h1>
                <span class="nks-tag muted">部门共享 · 权限隔离</span>
              </div>
              <p class="hero-sub">按部门和岗位浏览 AI 员工，找到合适的人来接任务。</p>
            </div>
            <div class="search-card">
              <label class="search-box" for="searchInput">
                <span class="search-mark"></span>
                <input id="searchInput" type="search" placeholder="搜索员工、岗位或任务" />
              </label>
              <div class="sort-switch" aria-label="排序方式">
                <button class="active" data-sort="hot">最常用</button>
                <button data-sort="new">最新</button>
              </div>
            </div>
          </section>

          <section class="category-bar">
            <nav class="category-tabs" id="categoryTabs" aria-label="部门分类"></nav>
          </section>

          <section class="summary-strip" id="summaryStrip"></section>

          <section class="grid" id="employeeGrid"></section>
          <section class="empty" id="emptyState">没有找到匹配的 AI 员工。可以换个关键词，或回到诊断页申请新岗位。</section>
        </div>
      </section>

      <!-- 右侧上下文 -->
      <aside>
        <div class="nks-card" style="margin-bottom:var(--sp-3);">
          <h2 style="margin-bottom:var(--sp-2);">当前企业</h2>
          <div class="ctx-row"><span class="label">企业名称</span><span class="value" id="ctxCompany">—</span></div>
          <div class="ctx-row"><span class="label">行业</span><span class="value" id="ctxIndustry">—</span></div>
          <div class="ctx-row"><span class="label">当前步骤</span><span class="value">员工仓库</span></div>
        </div>
        <div class="nks-card" style="margin-bottom:var(--sp-3);">
          <h2 style="margin-bottom:var(--sp-2);">仓库概览</h2>
          <div class="ctx-row"><span class="label">已启用</span><span class="value" id="ctxActive">—</span></div>
          <div class="ctx-row"><span class="label">试运行</span><span class="value" id="ctxTrial">—</span></div>
          <div class="ctx-row"><span class="label">待配置</span><span class="value" id="ctxPending">—</span></div>
          <div class="ctx-row"><span class="label">累计交办</span><span class="value" id="ctxTasks">—</span></div>
        </div>
        <a href="./job-agent-workbench-prototype.html" class="nks-btn primary" style="width:100%;height:48px;font-size:15px;justify-content:center;">
          开始派发任务 →
        </a>
      </aside>
    </main>
  </div>

  <script src="./assets/llm-config.js"></script>
  <script src="./assets/mock-data.js"></script>
  <script src="./assets/state.js"></script>
  <script>
    NKS.mountTopbar({ user: '张小北', tag: 'AI 员工仓库' });
    NKS.mountTimeline(4);

    const data = NKS.getCompanyData();

    // 右侧上下文卡片
    document.getElementById('ctxCompany').textContent = data.enterprise_identity.enterprise_name;
    document.getElementById('ctxIndustry').textContent = data.enterprise_identity.industry;
    const company = NKS.getCompany();
    const searchInput = document.getElementById("searchInput");
    const categoryTabs = document.getElementById("categoryTabs");
    const employeeGrid = document.getElementById("employeeGrid");
    const summaryStrip = document.getElementById("summaryStrip");
    const emptyState = document.getElementById("emptyState");
    const sortButtons = Array.from(document.querySelectorAll(".sort-switch button"));

    let activeCategory = "全部";
    let activeSort = "hot";

    function avatarFor(department, title) {
      const text = `${department || ""}${title || ""}`;
      if (text.includes("市场") || text.includes("内容")) return "./assets/avatars/mkt-cutout.png";
      if (text.includes("销售") || text.includes("客户")) return "./assets/avatars/sales.png";
      if (text.includes("财务")) return "./assets/avatars/finance.png";
      if (text.includes("人力") || text.includes("HR")) return "./assets/avatars/hr.png";
      return "./assets/avatars/ops.png";
    }

    function statusType(status) {
      if (String(status).includes("正在") || String(status).includes("启用")) return "active";
      if (String(status).includes("试")) return "trial";
      return "pending";
    }

    function baseEmployees() {
      const roster = (data.roster || []).map((item, index) => ({
        id: item.id,
        name: item.name,
        title: item.title,
        department: item.department,
        status: item.status,
        tasksDone: item.tasks_done || 0,
        tags: [item.department, item.status.split("·")[0].trim()],
        desc: `${item.title}，负责${item.department}的重复流程和资料整理，可从企业库、部门库和历史反馈中读取上下文。`,
        avatar: avatarFor(item.department, item.title),
        createdAt: 10 - index,
        canUse: true
      }));

      const recommendations = company === "hongke" ? [
        {
          id: "AGT-MKT-009",
          name: "小察",
          title: "行业洞察报告员",
          department: "市场部",
          status: "待配置",
          tasksDone: 0,
          tags: ["行业洞察", "选题支持"],
          desc: "持续收集公开行业信息，输出技术趋势、竞品动态和内容选题建议。",
          avatar: "./assets/avatars/mkt.png",
          createdAt: 2,
          canUse: false
        },
        {
          id: "AGT-SAL-012",
          name: "小跟",
          title: "客户线索整理专员",
          department: "销售部",
          status: "试运行",
          tasksDone: 5,
          tags: ["线索整理", "跟进提醒"],
          desc: "把活动报名、官网咨询和销售记录整理成客户摘要与下一步跟进清单。",
          avatar: "./assets/avatars/sales.png",
          createdAt: 4,
          canUse: true
        },
        {
          id: "AGT-DOC-018",
          name: "小档",
          title: "文档生成专员",
          department: "运营部",
          status: "待配置",
          tasksDone: 0,
          tags: ["文档生成", "模板套用"],
          desc: "根据企业模板自动生成说明文档、会议纪要和复盘报告。",
          avatar: "./assets/avatars/ops.png",
          createdAt: 1,
          canUse: false
        }
      ] : [
        {
          id: "AGT-PRD-006",
          name: "小码",
          title: "商品建档与编码助理",
          department: "商品部",
          status: "待配置",
          tasksDone: 0,
          tags: ["商品编码", "建档检查"],
          desc: "按校服编码规则自动生成建档表、查重验缺，并输出条码数据表。",
          avatar: "./assets/avatars/ops.png",
          createdAt: 2,
          canUse: false
        },
        {
          id: "AGT-FIN-009",
          name: "小报",
          title: "费用归集助理",
          department: "财务部",
          status: "试运行",
          tasksDone: 7,
          tags: ["费用归类", "汇总表"],
          desc: "读取多格式费用数据，自动归类、汇总并标记异常项。",
          avatar: "./assets/avatars/finance.png",
          createdAt: 3,
          canUse: true
        },
        {
          id: "AGT-DSN-003",
          name: "小图",
          title: "批量套图执行助理",
          department: "设计部",
          status: "待配置",
          tasksDone: 0,
          tags: ["图片处理", "批量归档"],
          desc: "按规则批量上传图片、生成模特图、下载并归档结果文件。",
          avatar: "./assets/avatars/mkt.png",
          createdAt: 1,
          canUse: false
        }
      ];

      const existingKeys = new Set(roster.map((item) => `${item.department}-${item.title}`));
      return roster.concat(recommendations.filter((item) => !existingKeys.has(`${item.department}-${item.title}`)));
    }

    let employees = baseEmployees();
    const categories = ["全部"].concat(Array.from(new Set(employees.map((item) => item.department))));

    function renderSummary(list) {
      const active = list.filter((item) => statusType(item.status) === "active").length;
      const trial = list.filter((item) => statusType(item.status) === "trial").length;
      const pending = list.filter((item) => statusType(item.status) === "pending").length;
      const tasks = list.reduce((sum, item) => sum + item.tasksDone, 0);
      summaryStrip.innerHTML = [
        ["已启用", `${active} 位`],
        ["试运行", `${trial} 位`],
        ["待配置", `${pending} 位`],
        ["累计交办", `${tasks} 件`]
      ].map(([label, value]) => `
        <div class="summary-card">
          <b>${value}</b>
          <span>${label}</span>
        </div>
      `).join("");
    }

    function renderCategories() {
      categoryTabs.innerHTML = categories.map((category) => `
        <button class="${category === activeCategory ? "active" : ""}" data-category="${category}">${category}</button>
      `).join("");
      categoryTabs.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          activeCategory = button.dataset.category;
          render();
        });
      });
    }

    function filteredEmployees() {
      const keyword = searchInput.value.trim().toLowerCase();
      let list = employees.filter((item) => {
        const inCategory = activeCategory === "全部" || item.department === activeCategory;
        const haystack = `${item.name} ${item.title} ${item.department} ${item.tags.join(" ")} ${item.desc}`.toLowerCase();
        return inCategory && (!keyword || haystack.includes(keyword));
      });

      list = list.slice().sort((a, b) => {
        if (activeSort === "new") return b.createdAt - a.createdAt;
        return b.tasksDone - a.tasksDone;
      });
      return list;
    }

    function openEmployee(item) {
      NKS.setState({
        selectedEmployee: item,
        rosterEntryMode: true,
        rosterSelectedAt: new Date().toISOString()
      });
      location.href = item.canUse
        ? "./agent-birth-card.html?birth=0&from=roster"
        : "./job-agent-workbench-prototype.html#diagnosis";
    }

    function renderGrid(list) {
      emptyState.style.display = list.length ? "none" : "block";
      employeeGrid.innerHTML = list.map((item, index) => `
        <article class="employee-card" data-index="${index}">
          <div class="employee-top">
            <div class="avatar">${item.avatar ? `<img src="${item.avatar}" alt="${item.name}">` : `<span>${item.name.slice(-1)}</span>`}</div>
            <div class="who">
              <h3 title="${item.title}">${item.title}</h3>
              <div class="tag-row">
                ${item.tags.slice(0, 2).map((tag) => `<span class="mini-tag">${tag}</span>`).join("")}
              </div>
            </div>
          </div>
          <p class="employee-desc">${item.desc}</p>
          <div class="employee-foot">
            <span><b>${item.name}</b> · ${item.tasksDone} 次交办</span>
            <span class="status ${statusType(item.status)}">${item.status}</span>
          </div>
        </article>
      `).join("");

      employeeGrid.querySelectorAll(".employee-card").forEach((card) => {
        card.addEventListener("click", () => openEmployee(list[Number(card.dataset.index)]));
      });
    }

    function render() {
      const list = filteredEmployees();
      renderCategories();
      renderSummary(list);
      renderGrid(list);
    }

    searchInput.addEventListener("input", render);
    sortButtons.forEach((button) => {
      button.addEventListener("click", () => {
        activeSort = button.dataset.sort;
        sortButtons.forEach((item) => item.classList.toggle("active", item === button));
        render();
      });
    });

    render();

    // 右侧汇总（渲染后计算）
    function updateCtxSidebar() {
      const all = baseEmployees();
      document.getElementById('ctxActive').textContent = all.filter(i => statusType(i.status) === 'active').length + ' 位';
      document.getElementById('ctxTrial').textContent = all.filter(i => statusType(i.status) === 'trial').length + ' 位';
      document.getElementById('ctxPending').textContent = all.filter(i => statusType(i.status) === 'pending').length + ' 位';
      document.getElementById('ctxTasks').textContent = all.reduce((s, i) => s + i.tasksDone, 0) + ' 件';
    }
    updateCtxSidebar();
  </script>
</body>
</html>
